<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyzing Your Heart...</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #1a0a1f 0%, #2d1435 50%, #4a1f4a 100%);
      color: white;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 30px 20px;
    }

    .stars-container,
    .hearts-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      animation: fall linear infinite;
      opacity: 0;
    }

    @keyframes fall {
      0% { transform: translateY(-100px); opacity: 0; }
      10%,90% { opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }

    .floating-heart {
      position: absolute;
      font-size: 20px;
      animation: float-heart 8s linear infinite;
      opacity: 0;
    }

    @keyframes float-heart {
      0% { transform: translateY(100vh) scale(.5); opacity: 0; }
      10%,90% { opacity: .6; }
      100% { transform: translateY(-100px) scale(1) rotate(360deg); opacity: 0; }
    }

    .content-wrapper {
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      font-size: 32px;
      color: #ff6b9d;
      text-align: center;
    }

    #container {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 3/4;
      border-radius: 25px;
      overflow: hidden;
      border: 3px solid rgba(255,166,193,.5);
      background: #000;
      position: relative;
    }

    video { width: 100%; height: 100%; object-fit: cover; }

    .scan-line {
      position: absolute;
      width: 100%;
      height: 4px;
      background: #ff6b9d;
      animation: scan 2.5s infinite;
    }

    @keyframes scan {
      0% { top: 10%; opacity: 0; }
      10%,90% { opacity: 1; }
      50% { top: 90%; }
      100% { opacity: 0; }
    }

    .heart-scanner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
      opacity: .4;
    }

    #status {
      font-size: 20px;
      text-align: center;
      color: #ffa6c1;
    }

    .loading-dots span {
      width: 6px;
      height: 6px;
      background: #ffa6c1;
      border-radius: 50%;
      display: inline-block;
      animation: bounce 1.4s infinite;
    }

    @keyframes bounce {
      0%,80%,100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .final-message-section { display: none; flex-direction: column; gap: 20px; }
    .final-message-section.show { display: flex; }

    .continue-button {
      padding: 15px 40px;
      border-radius: 50px;
      border: none;
      background: #ff6b9d;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="stars-container" id="stars"></div>
<div class="hearts-container" id="hearts"></div>

<div class="content-wrapper">
  <h1>Analyzing Your Heart...</h1>

  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <div class="scan-line"></div>
    <div class="heart-scanner">💖</div>
  </div>

  <div id="status">
    Checking if you are mine
    <div class="loading-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="final-message-section" id="final-message-section">
    <div>Let's check if you are my real bebo or not 💕</div>
    <button class="continue-button" id="continue-btn">✨ Click Here ✨</button>
  </div>
</div>

<audio id="bgMusic" loop>
  <source src="static/music/bg1.mp3" type="audio/mpeg">
</audio>

<script>
  // stars
  const stars = document.getElementById("stars");
  setInterval(() => {
    const s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random()*100+"%";
    s.style.animationDuration = (3+Math.random()*4)+"s";
    stars.appendChild(s);
    setTimeout(()=>s.remove(),8000);
  },500);

  // hearts
  const hearts = document.getElementById("hearts");
  const symbols = ['💕','💖','💗','💝'];
  setInterval(() => {
    const h = document.createElement("div");
    h.className = "floating-heart";
    h.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    h.style.left = Math.random()*100+"%";
    hearts.appendChild(h);
    setTimeout(()=>h.remove(),11000);
  },1200);

  // camera
  const video = document.getElementById("video");
  const statusText = document.getElementById("status");
  let streamRef = null;

  navigator.mediaDevices.getUserMedia({ video:true })
    .then(s => { streamRef=s; video.srcObject=s; })
    .catch(()=>{ statusText.innerText="Camera permission denied 😔"; });

  setTimeout(()=>{
    statusText.innerText="Analysis Complete! 💖";
    setTimeout(()=>{
      statusText.style.display="none";
      document.getElementById("final-message-section").classList.add("show");
    },800);
  },5000);

  document.getElementById("continue-btn").addEventListener("click",()=>{
    localStorage.setItem("musicAllowed","yes");
    if(streamRef) streamRef.getTracks().forEach(t=>t.stop());
    window.location.href="question1.html";
  });

  // music
  const bgMusic = document.getElementById("bgMusic");
  window.addEventListener("load",()=>{
    if(localStorage.getItem("musicAllowed")==="yes" && bgMusic){
      bgMusic.volume=0.15;
      bgMusic.play().catch(()=>{});
    }
  });
</script>

</body>
</html>
