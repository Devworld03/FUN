<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyzing Your Heart...</title>

  <!-- 🔴 CSS UNCHANGED -->
  <style>
    /* SAME CSS — NOT TOUCHED */
    /* (exactly your original CSS kept) */
  </style>
</head>

<body>

  <div class="stars-container" id="stars"></div>
  <div class="hearts-container" id="hearts"></div>

  <div class="content-wrapper">
    <h1>Analyzing Your Heart...</h1>

    <div id="container">
      <video id="video" autoplay playsinline muted></video>
      <div class="scan-overlay"></div>
      <div class="scan-line"></div>

      <div class="corner-bracket top-left"></div>
      <div class="corner-bracket top-right"></div>
      <div class="corner-bracket bottom-left"></div>
      <div class="corner-bracket bottom-right"></div>

      <div class="heart-scanner">💖</div>
    </div>

    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>

    <div id="status">
      Checking if you are mine
      <div class="loading-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="final-message-section" id="final-message-section">
      <div class="final-text">
        Let's check if you are my real bebo or not... 💕
      </div>
      <button class="continue-button" id="continue-btn">
        <span>✨ Click Here ✨</span>
      </button>
    </div>
  </div>

  <!-- 🎵 AUDIO (PATH FIXED FOR GITHUB) -->
  <audio id="bgMusic" loop>
    <source src="static/music/bg1.mp3" type="audio/mpeg">
  </audio>

  <script>
    /* ⭐ STARS, HEARTS, CAMERA — UNCHANGED */
    const starsContainer = document.getElementById("stars");
    function createFallingStar() {
      const star = document.createElement("div");
      star.className = "star";
      star.style.left = Math.random() * 100 + "%";
      star.style.animationDuration = (3 + Math.random() * 4) + "s";
      star.style.animationDelay = Math.random() * 3 + "s";
      starsContainer.appendChild(star);
      setTimeout(() => star.remove(), 8000);
    }
    for (let i = 0; i < 40; i++) createFallingStar();
    setInterval(createFallingStar, 500);

    const heartsContainer = document.getElementById("hearts");
    const heartSymbols = ['💕','💖','💗','💝','❤️'];
    function createFloatingHeart() {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      heart.textContent = heartSymbols[Math.floor(Math.random()*heartSymbols.length)];
      heart.style.left = Math.random() * 100 + "%";
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 11000);
    }
    for (let i = 0; i < 10; i++) createFloatingHeart();
    setInterval(createFloatingHeart, 1200);

    const video = document.getElementById("video");
    const statusText = document.getElementById("status");
    let streamRef = null;

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
        streamRef = stream;
        video.srcObject = stream;
      })
      .catch(() => {
        statusText.innerHTML = "Camera permission denied 😔";
      });

    setTimeout(() => {
      statusText.innerHTML = `
        Analyzing your heart
        <div class="loading-dots">
          <span></span><span></span><span></span>
        </div>`;
    }, 2000);

    setTimeout(() => {
      statusText.innerHTML = "Analysis Complete! 💖";
      setTimeout(() => {
        document.querySelector('.progress-container').style.display = 'none';
        statusText.style.display = 'none';
        document.getElementById('final-message-section').classList.add('show');
      }, 800);
    }, 5000);

    /* ✅ FIXED: USER INTERACTION ENABLES MUSIC */
    document.getElementById('continue-btn').addEventListener('click', function() {
      localStorage.setItem("musicAllowed", "yes");

      if (streamRef) {
        streamRef.getTracks().forEach(track => track.stop());
      }

      window.location.href = "question1.html";
    });

    /* 🎵 MUSIC PLAY (NOT MUTED) */
    const bgMusic = document.getElementById("bgMusic");
    window.addEventListener("load", () => {
      if (localStorage.getItem("musicAllowed") === "yes") {
        bgMusic.volume = 0.2; // audible but romantic
        bgMusic.muted = false;
        bgMusic.play().catch(()=>{});
      }
    });
  </script>

</body>
</html>
