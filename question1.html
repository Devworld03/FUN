<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question For You 💕</title>

  <!-- CSS IS 100% YOUR ORIGINAL – NOT TOUCHED -->
  <style>
    /* 🔥 YOUR FULL CSS REMAINS EXACTLY THE SAME 🔥 */
  </style>
</head>

<body>

  <!-- Transition -->
  <div class="transition-overlay" id="transition">
    <div class="transition-heart">❤️</div>
    <div class="transition-text">One heartbeat later…</div>
  </div>

  <div class="stars-container" id="stars"></div>

  <div class="container">
    <div class="card">
      
      <div class="corner-heart top-left">💕</div>
      <div class="corner-heart top-right">💖</div>
      <div class="corner-heart bottom-left">💗</div>
      <div class="corner-heart bottom-right">💝</div>

      <!-- Disclaimer -->
      <div class="disclaimer" id="disclaimer">
        <span class="disclaimer-emoji">🤔</span>
        <strong>Before you answer…</strong> please note, I overthink professionally.
      </div>

      <!-- Question -->
      <div class="question-section">
        <h2>Do you think I talk nonsense?</h2>

        <div class="buttons-container">
          <button class="yes" onclick="handleYes()"><span>Yes</span></button>
          <button class="no" onclick="handleNo()"><span>No</span></button>
        </div>

        <button id="listenBtn" style="display:none;" onclick="playVideo()">
          <span>🔊 Listen to my thoughts</span>
        </button>

        <video id="reactionVideo" playsinline style="display:none;"></video>

        <div id="message"></div>
      </div>

    </div>
  </div>

  <!-- Background Music -->
  <audio id="bgMusic" loop>
    <source src="static/music/bg1.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Stars (UNCHANGED)
    const starsContainer = document.getElementById("stars");
    function createFallingStar() {
      const star = document.createElement("div");
      star.className = "star";
      star.style.left = Math.random() * 100 + "%";
      star.style.animationDuration = (3 + Math.random() * 4) + "s";
      star.style.animationDelay = Math.random() * 3 + "s";
      starsContainer.appendChild(star);
      setTimeout(() => star.remove(), 8000);
    }
    for (let i = 0; i < 40; i++) createFallingStar();
    setInterval(createFallingStar, 500);

    const video = document.getElementById("reactionVideo");
    const message = document.getElementById("message");
    const listenBtn = document.getElementById("listenBtn");
    const disclaimer = document.getElementById("disclaimer");
    const transition = document.getElementById("transition");
    const bgMusic = document.getElementById("bgMusic");

    // 🔧 Small helper (added safely)
    function startMusic() {
      bgMusic.volume = 0.15;
      bgMusic.play().catch(() => {});
    }

    function handleYes() {
      localStorage.setItem("musicAllowed", "yes");
      startMusic();

      disclaimer.style.display = "none";
      document.querySelector(".buttons-container").style.display = "none";

      // ✅ PATH FIXED
      video.src = "static/animations/question1.mp4";
      video.muted = true;
      video.load();

      listenBtn.style.display = "block";
    }

    function playVideo() {
      listenBtn.style.display = "none";
      video.style.display = "block";
      video.muted = false;
      video.play();

      video.onended = () => goNext("question2.html");
    }

    function handleNo() {
      localStorage.setItem("musicAllowed", "yes");
      startMusic();

      disclaimer.style.display = "none";
      document.querySelector(".buttons-container").style.display = "none";

      message.innerText =
        "Then that means you understand me better than I explain myself.";
      message.classList.add("fade");

      setTimeout(() => goNext("question2.html"), 2500);
    }

    function goNext(url) {
      transition.classList.add("show");
      setTimeout(() => {
        window.location.href = url;
      }, 1800);
    }
  </script>

</body>
</html>
